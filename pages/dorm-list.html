<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宿舍开学必备清单｜CTBU一只喵</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="article">
    <a class="back" href="../index.html">← 返回导航站</a>

    <div class="ctop">
      <div class="tag">校园生活 · 报到前</div>
      <h1>宿舍开学必备清单</h1>
      <p class="lead">床垫怎么选？带什么不踩坑？CTBU学姐逐项拆解，照着准备就对了。</p>
    </div>

    <div class="article-body">
      <p class="intro">报到前一周最容易手忙脚乱：怕漏带、怕买错、怕行李箱塞爆。这份清单把床垫、床品、电子、药品、军训和避雷一次性说清楚，按模块准备，报到当天轻装上阵。</p>

      <figure class="figure">
        <img src="../content/dorm-list/img_1.png" alt="宿舍开学必备清单封面" loading="lazy" />
        <figcaption>攻略封面：六大模块一键直达——床垫、床品、生活、电子、药品军训、避雷</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_2.png" alt="床垫选购指南上" loading="lazy" />
        <figcaption>床垫选购（上）：CTBU床铺统一为190×90cm，厚度选择上铺5-8cm、下铺≤10cm</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_3.png" alt="床垫选购指南下" loading="lazy" />
        <figcaption>床垫选购（下）：天然乳胶/记忆棉/椰棕材质对比 + 学生床垫「六不买」避坑</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_4.png" alt="床上用品选购指南" loading="lazy" />
        <figcaption>床上用品选购：三件套尺寸、重庆气候被子方案、宿舍刚需好物与学姐打包建议</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_5.png" alt="学习用品和电子产品" loading="lazy" />
        <figcaption>学习用品 + 电子产品：按专业配置电脑 + 宿舍用电刚需，不花冤枉钱</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_6.png" alt="常备药品和军训专属" loading="lazy" />
        <figcaption>常备药品 + 军训专属：水土不服小药箱 + 9月高温军训保命装备清单</figcaption>
      </figure>

      <figure class="figure">
        <img src="../content/dorm-list/img_7.png" alt="避雷清单和CTBU专属贴士" loading="lazy" />
        <figcaption>避雷清单 + CTBU专属贴士：违禁电器、鸡肋物品、报到必知、学姐打包4句话</figcaption>
      </figure>

      <div class="closing">
        <strong>学姐碎碎念：</strong>被子别从家扛，冬被国庆回家再拿或快递；证件随身带，贵重物品不离身；报到前1-2天寄快递到学校，别提前一周堆菜鸟。清单在手，报到不慌。
      </div>
    </div>
  </main>
</body>
</html>
